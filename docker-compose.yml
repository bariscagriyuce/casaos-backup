name: casaos-backup

services:
  casaos-backup:
    build: .
    image: casaos-backup:local
    container_name: casaos-backup
    hostname: casaos
    restart: unless-stopped
    init: true
    # Yedek sunucuyu kilitlemesin diye kaynak sınırı (.env içinden değiştirilebilir)
    cpus: ${BACKUP_CPUS:-1.0}
    mem_limit: ${BACKUP_MEM_LIMIT:-1536m}
    env_file: .env
    environment:
      RCLONE_CONFIG: /config/rclone/rclone.conf
      RESTIC_CACHE_DIR: /cache
      # Prune ile silinen parçalar Drive çöp kutusunda kotayı doldurmasın
      RCLONE_DRIVE_USE_TRASH: "false"
      # Drive'a daha büyük dilimlerle yükle (varsayılan 8M yavaş); RAM ≈ dilim × 5 bağlantı
      RCLONE_DRIVE_CHUNK_SIZE: ${DRIVE_CHUNK_SIZE:-32M}
      # restic'in RAM/CPU kullanımını azalt
      GOMAXPROCS: ${BACKUP_GOMAXPROCS:-2}
      GOGC: "50"
      # docker logs'ta dakikada bir ilerleme satırı göster
      RESTIC_PROGRESS_FPS: "0.0167"
    labels:
      casaos-backup.self: "true"
    volumes:
      # Yedek sırasında konteynerleri durdurup başlatmak için
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config
      - ./cache:/cache
      - ./restore:/restore

      # ---- Yedeklenecek yollar: hepsi /source altına, salt okunur ----
      # Uygulama verileri (CasaOS uygulamalarının ayarları/veritabanları)
      - /DATA/AppData:/source/DATA/AppData:ro
      # CasaOS uygulama tanımları (docker-compose dosyaları) ve veritabanı
      - /var/lib/casaos:/source/var/lib/casaos:ro
      # CasaOS sistem yapılandırması
      - /etc/casaos:/source/etc/casaos:ro

      # İsteğe bağlı: kişisel klasörler (büyük olabilir, Drive kotanıza dikkat)
      # - /DATA/Documents:/source/DATA/Documents:ro
      # - /DATA/Gallery:/source/DATA/Gallery:ro
      # İsteğe bağlı: isimli Docker volume'ları
      # - /var/lib/docker/volumes:/source/var/lib/docker/volumes:ro
